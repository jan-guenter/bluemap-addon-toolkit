name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - name: Check out toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -v
          PYTHONPATH=src python -m bluemap_addon_toolkit --version

      - name: Build and audit distributions
        if: matrix.python == '3.14'
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: -r requirements/build.txt
          python tools/build_release.py dist
          python tools/audit_distribution.py dist/*
          python -m pip install --no-deps --force-reinstall dist/*.whl
          bluemap-addon-toolkit --version

      - name: Upload review distributions
        if: matrix.python == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-addon-toolkit-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
